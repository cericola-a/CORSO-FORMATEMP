<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Esercizio 4</title>
    <link rel="stylesheet" href="./style4.css">
</head>
<body>
    
<h1>Esercizio 4 - Trasformazioni, transizioni e animazioni</h1>

<!-- Div da ruotare di 45 gradi -->
<div id="div-ruotato">
    Div ruotato di 45°
</div>

<!-- Div che cambia colore gradualmente al passaggio del mouse -->
<div id="div-colore">
    Passa il mouse per cambiare colore
</div>

<!-- Div che cambia colore continuamente in un loop infinito -->
<div id="div-animato">
    Animazione continua del colore
</div>

<!-- Div che aumenta gradualmente le dimensioni al passaggio del mouse -->
<div id="div-dimensioni">
    Passa il mouse per ingrandire
</div>

<!-- Div da spostare, ruotare e ingrandire al passaggio del mouse -->
<div id="div-trasformato">
    Spostamento, rotazione e ingrandimento
</div>

</body>
</html>
