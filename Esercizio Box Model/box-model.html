<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box Model</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!--width/height === min width/min height === max width/max height -->

    <h1>PUNTO 1</h1>
    <div id="box1">WIDTH/HEIGHT</div>
    <div id="box2">MIN WIDTH/MIN HEIGHT</div>
    <div id="box3">MAX WIDTH/MAX HEIGHT</div> 
    
    <!--padding-top, padding-bottom, padding-left, padding-right, padding abbreviato -->
    <h1>PUNTO 2 - padding</h1>
    <div id="box4" class="grandezza">top</div>
    <div id="box5" class="grandezza">bottom</div>
    <div id="box6" class="grandezza">right</div>
    <div id="box7" class="grandezza">left</div>
    <div id="box8" class="grandezza">abbreviato</div>

    <!--border-width, border-style, border, border-radius, border-image (sia con un’immagine sia con un gradiente), outline-->
    <h1>PUNTO 3</h1>
    <div id="bw-bs" class="grandezza">border-width e border-style</div>
    <div id="b" class="grandezza">border</div>
    <div id="br" class="grandezza">border-radius</div>
    <div id="bi" class="grandezza">border-image</div>
    <div id="out" class="grandezza">outline</div>

    <!--margin (sia con la proprietà a sintassi abbreviata sia con le singole proprietà e provate anche l’utilizzo di valori negativi), margin-collapsing-->
    <h1>PUNTO 4</h1>
    <div id="mt" class="grandezza box">margin-top</div>
    <div id="mb" class="grandezza box">margin-bottom</div>
    <div id="mr" class="grandezza box">margin-right</div>
    <div id="ml" class="grandezza box">margin-left</div>
    <div id="m" class="grandezza box">margin</div>
    <div id="negativi" class="grandezza box">margini-negativi</div>
    <div id="collapsing" class="grandezza box">collapsing</div>
</body>
</html>
