<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelle</title>
</head>
<body>
    <table border="1">
        <caption>Persone collegate</caption>
        <thead>
            <tr>
                <th>ID</th>
                <th>Nome</th>
                <th>Cognome</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>1</td>
                <td>Mario</td>
                <td>Rossi</td>
            </tr>
            <tr>
                <td>2</td>
                <td>Luigi</td>
                <td>Bianchi</td>
            </tr>
            <tr>
                <td>3</td>
                <td>Giulia</td>
                <td>Verdi</td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <td colspan="3">Totale persone: 3</td>
            </tr>
        </tfoot>
    </table>
</body>
</html>
